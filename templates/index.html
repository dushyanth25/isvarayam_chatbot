<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Isvaryam AI — Cold-Pressed Oils &amp; Natural Products</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="chat-shell">
      <!-- Minimal Top Header -->
      <header class="chat-header">
        <div class="header-left">
          <button type="button" id="backResetBtn" class="header-icon-btn" title="New Conversation" aria-label="New Conversation">
            <i class="fas fa-chevron-left"></i>
          </button>
          <h1 class="header-title">Isvaryam AI</h1>
        </div>

        <div class="header-right">
          <button type="button" id="menuBtn" class="header-icon-btn" title="Menu" aria-label="Open menu" aria-expanded="false" aria-controls="headerMenu">
            <i class="fas fa-ellipsis"></i>
          </button>
          <div id="headerMenu" class="header-menu hidden" role="menu">
            <button type="button" id="menuNewChat" class="menu-item" role="menuitem">
              <i class="fas fa-rotate-right"></i> New Chat
            </button>
            <a href="https://isvaryam.com/" target="_blank" rel="noopener noreferrer" class="menu-item" role="menuitem">
              <i class="fas fa-store"></i> Visit Isvaryam Store
            </a>
            <a href="tel:+919578822000" class="menu-item" role="menuitem">
              <i class="fas fa-phone"></i> Call +91 9578822000
            </a>
          </div>
        </div>
      </header>

      <!-- Scrollable Chat Thread -->
      <main id="chatbox" class="chatbox" role="log" aria-live="polite">
        <!-- Initial Bot Greeting Bubble -->
        <div class="msg-row bot" id="initialGreeting">
          <div class="msg-avatar bot-avatar" aria-hidden="true">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="18" cy="18" r="18" fill="#E9EEF5"/>
              <rect x="8" y="10" width="20" height="16" rx="6" fill="#FFFFFF" stroke="#B8C4D4" stroke-width="1.5"/>
              <rect x="10.5" y="12.5" width="15" height="10" rx="4" fill="#1E293B"/>
              <circle cx="15" cy="17" r="1.5" fill="#FFFFFF"/>
              <circle cx="21" cy="17" r="1.5" fill="#FFFFFF"/>
              <path d="M16 19.5C16.8 20.3 19.2 20.3 20 19.5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="msg-bubble">
            <div class="msg-text">
              <p>Vanakkam! Welcome to <strong>Isvaryam</strong>. I can help you with cold-pressed oils, pure Bilona cow ghee, organic jaggery, prices, reviews, and delivery details in English, தமிழ், or Tanglish.</p>
            </div>
            <div class="msg-time" id="welcomeTime"></div>
          </div>
        </div>
      </main>

      <!-- Typing Indicator -->
      <div id="typingIndicator" class="typing-row hidden" aria-live="polite" aria-label="Isvaryam AI is typing">
        <div class="msg-avatar bot-avatar" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="18" r="18" fill="#E9EEF5"/>
            <rect x="8" y="10" width="20" height="16" rx="6" fill="#FFFFFF" stroke="#B8C4D4" stroke-width="1.5"/>
            <rect x="10.5" y="12.5" width="15" height="10" rx="4" fill="#1E293B"/>
            <circle cx="15" cy="17" r="1.5" fill="#FFFFFF"/>
            <circle cx="21" cy="17" r="1.5" fill="#FFFFFF"/>
          </svg>
        </div>
        <div class="typing-bubble">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- Quick Suggestions & Composer -->
      <footer class="composer-dock">
        <div class="quick-chips" role="toolbar" aria-label="Quick suggestions">
          <button type="button" class="chip" data-query="What products do you offer?">Products</button>
          <button type="button" class="chip" data-query="Chekku ennai price enna?">Oil Prices</button>
          <button type="button" class="chip" data-query="What is in your Super Pack combo?">Super Pack</button>
          <button type="button" class="chip" data-query="How many days for delivery to Coimbatore and Chennai?">Delivery</button>
          <button type="button" class="chip" data-query="What is your store contact and location?">Contact</button>
        </div>

        <form id="chatForm" class="input-form" autocomplete="off">
          <input
            type="text"
            id="userInput"
            class="chat-input"
            placeholder="Ask in English, Tamil, or Tanglish..."
            maxlength="500"
            aria-label="Message"
            required
          />
          <button type="submit" id="sendButton" class="send-btn" title="Send" aria-label="Send message" disabled>
            <i class="fas fa-paper-plane"></i>
          </button>
        </form>
      </footer>
    </div>
  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
